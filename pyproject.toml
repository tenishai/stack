[project]
name = "tenish-stack"
version = "0.1.0"
description = "Install the tenish stack on a Gojira: one file, one command, the merges stay with a person."
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
dependencies = ["pydantic>=2", "pyyaml>=6", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "tenish-stack[ui]"]
# `stack ui`: the same files behind buttons (stack#12)
ui = ["fastapi>=0.110", "uvicorn>=0.27", "jinja2>=3", "python-multipart>=0.0.9"]

[project.scripts]
stack = "stack.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["stack"]

[tool.setuptools.package-data]
stack = ["templates/*.html"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# The same pins gojira uses: ruff 0.16 widened its defaults.
select = ["E4", "E7", "E9", "F", "UP", "I"]
