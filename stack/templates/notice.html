{% extends "base.html" %}
{% block title %}stack · {{ title }}{% endblock %}
{% block content %}
<div class="page-head"><h1>{{ title }}</h1></div>
<section class="stage rail-{{ level }}">
  <div class="stage-body">
    <p style="margin:0 0 12px">{{ text }}</p>
    {% if link %}<p style="margin:0"><a href="{{ link }}">{{ link_text }}</a></p>{% endif %}
  </div>
</section>
{% endblock %}
