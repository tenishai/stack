<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}stack{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>
  <style>
    :root { --fg:#1c1c1e; --muted:#6b7280; --line:#e5e7eb; --bg:#f7f7f8; --accent:#2563eb; }
    * { box-sizing: border-box; }
    body { margin:0; font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
           color:var(--fg); background:var(--bg); }
    header { display:flex; align-items:center; gap:24px; padding:14px 28px;
             background:#fff; border-bottom:1px solid var(--line); }
    .brand { font-weight:700; font-size:18px; text-decoration:none; color:var(--fg); }
    nav a { margin-right:18px; text-decoration:none; color:var(--muted); }
    nav a:hover { color:var(--accent); }
    main { max-width:920px; margin:28px auto; padding:0 20px; }
    h1 { font-size:22px; margin:0 0 18px; } h2 { font-size:16px; margin:24px 0 10px; }
    table { width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--line);
            border-radius:10px; overflow:hidden; }
    th,td { text-align:left; padding:10px 14px; border-bottom:1px solid var(--line); vertical-align:top; }
    th { font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); background:#fbfbfc; }
    tr:last-child td { border-bottom:none; }
    a { color:var(--accent); }
    .card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:20px; margin-bottom:18px; }
    form.stack label { display:block; font-size:13px; color:var(--muted); margin:12px 0 4px; }
    input[type=text],select { width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:8px; font:inherit; }
    button { margin-top:16px; padding:9px 16px; border:0; border-radius:8px; background:var(--accent);
             color:#fff; font:inherit; font-weight:600; cursor:pointer; }
    button.quiet { background:#fff; color:var(--fg); border:1px solid var(--line); }
    button.danger { background:#fee2e2; color:#991b1b; }
    .row { display:flex; gap:12px; } .row > * { flex:1; }
    .inline { display:inline; } .inline button { margin:0 6px 0 0; }
    th.releases { width:280px; }
    .pick select { width:auto; padding:5px 8px; margin:4px 0; } .pick button { margin:4px 0 0; padding:6px 12px; }
    .pick label { display:block; margin:6px 0; } .pick input[type=checkbox] { width:auto; }
    details > summary { cursor:pointer; margin:24px 0 10px; font-size:16px; font-weight:600; }
    .badge { display:inline-block; padding:2px 9px; border-radius:999px; font-size:12px; font-weight:600; }
    .b-ok,.b-done { background:#dcfce7; color:#166534; }
    .b-running,.b-info { background:#dbeafe; color:#1e40af; }
    .b-warn { background:#fef3c7; color:#92400e; }
    .b-fail,.b-failed { background:#fee2e2; color:#991b1b; }
    .muted { color:var(--muted); } .err { color:#991b1b; font-size:13px; }
    .mono { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12.5px; }
    .line { display:flex; gap:10px; padding:5px 0; border-bottom:1px solid var(--line); }
    .line:last-child { border-bottom:none; }
    .line .text { flex:1; white-space:pre-wrap; }
    .line.head { font-weight:700; margin-top:8px; }
    .line.ok { color:#166534; } .line.warn { color:#92400e; } .line.fail { color:#991b1b; font-weight:600; }
    .checks label { display:inline-block; margin-right:14px; font-size:14px; }
  </style>
</head>
<body>
  <header>
    <a href="/" class="brand">🧱 stack</a>
    <nav><a href="/">Profiles</a></nav>
    <span id="going">{% if runner.active() %}<span class="badge b-running">run #{{ runner.active().id }} going</span>{% endif %}</span>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
