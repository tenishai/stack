# Tests and lint on every push to main and every pull request, on GitHub-hosted
# runners only: a public repo must never let a pull request reach a self-hosted
# machine (agora discussion 71, rule 4). The `ci` job is the one check the
# branch ruleset requires; it passes only when every other job passed.
# tests/test_ci_workflow.py keeps both true.
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python3 -m venv .venv
          env -u PYTHONPATH .venv/bin/python -m pip install -q -e ".[dev]"
      - name: Lint
        run: env -u PYTHONPATH .venv/bin/ruff check stack tests
      - name: Test
        run: env -u PYTHONPATH .venv/bin/python -m pytest -q

  ci:
    # The summary the ruleset requires: reports even when a job fails, and
    # fails unless every needed result is "success".
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ join(needs.*.result, ',') }}" = "success"
