# Tests and lint on every push and pull request. Runs on the self-hosted
# runner the repository variable CI_RUNNER names (spark); unset, GitHub's.
# A self-hosted runner must never run a fork's code: pull requests from a
# fork fall back to GitHub-hosted ubuntu-latest.
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || (vars.CI_RUNNER || 'ubuntu-latest') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Install
        run: |
          rm -rf .venv
          python3 -m venv .venv
          env -u PYTHONPATH .venv/bin/python -m pip install -q -e ".[dev]"
      - name: Lint
        run: env -u PYTHONPATH .venv/bin/ruff check stack tests
      - name: Test
        run: env -u PYTHONPATH .venv/bin/python -m pytest -q
