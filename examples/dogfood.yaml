# The tenish stack on the dogfood (shaz-learning / gojira-sandbox), as it was
# brought up by hand on 2026-10-08 and as `stack install` brings it up now.
#
# Order matters and is the dependency order: litellm (the model proxy) first,
# cabal (the switchboard; needs litellm's key) second, then liminal and kobo,
# whose Secrets hold tokens minted on that cabal. Values name where they come
# from; nothing secret is in this file. Relative paths are relative to this
# file, so the two config files live in dogfood/ next to it. The only thing
# you bring by hand is the GitHub App's private key; the keys are generated
# here and kept in .generated/ (mode 600, gitignored).

gojira:
  namespace: gojira
  # Pinned: a stranger's current kubectl context can be any cluster. This is
  # the name `gcloud container clusters get-credentials` writes for the
  # dogfood cluster; KUBECONFIG must point at the file that holds it.
  kube_context: gke_shaz-learning_us-central1_gojira-sandbox

cluster:
  name: gojira-sandbox
  gcp_project: shaz-learning
  location: us-central1

apps:
  - name: litellm
    repo: tenishai/litellm-deploy
    secrets:
      litellm-secrets:
        LITELLM_MASTER_KEY: generate:32:litellm-master-key   # one value, shared with cabal below

  - name: cabal
    repo: tenishai/cabal
    bootstrap: cabal           # catch the bootstrap code from its log, log in, mint below
    configmaps:
      cabal-config:
        identity.toml: file:dogfood/cabal-identity.toml
    secrets:
      cabal-secrets:
        CABAL_MASTER_KEY: generate:32
        LITELLM_MASTER_KEY: generate:32:litellm-master-key

  - name: liminal
    repo: tenishai/liminal
    secrets:
      liminal-secrets:
        LIMINAL_CABAL_TOKEN: cabal-token:service:liminal:secrets-fetch

  - name: kobo
    repo: tenishai/kobo
    cluster_objects: [k8s/cluster/rbac.yaml]     # the ClusterRole Gojira binds via cluster_roles
    secrets:
      kobo-github:
        private-key.pem: file:~/tenish-room.pem
      kobo-config:
        config.yaml: template:dogfood/kobo-config.template.yaml
      kobo-cabal:
        CABAL_OPERATOR_TOKEN: cabal-token:service:kobo:operator
