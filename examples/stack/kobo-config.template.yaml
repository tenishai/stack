# kobo's config for your install (namespace kobo), mounted from the Secret
# kobo-config at /config/config.yaml. Nothing here is edited: the tokens are
# filled when the Secret is written — {org}, {project}, {region} and {cluster}
# from the profile, {gojira_token} from Gojira's own API token, {app_id} and
# {installation_id} from the GitHub App the env file names. Every key is
# described in kobo's api/config.example.yaml.
github_org: "{org}"
org_repo: "{org}/kobo-config"       # the org's config repo (org.yaml); kobo's bootstrap creates it (install.md step 5)
# The runtime every agent runs on. Every tenishai/daedalus release from v0.10.0 publishes
# ghcr.io/tenishai/daedalus-runtime:vX.Y.Z (github.com/tenishai/daedalus/releases); pin the
# digest from the release page.
runtime_image: ghcr.io/tenishai/daedalus-runtime:v0.10.0@sha256:34e061ee103f3e59a804a163a950403423c8a2c4591b306775e71900c06ac082
gojira_url: http://gojira.gojira.svc.cluster.local
gojira_token: "{gojira_token}"
gojira_cluster: "{cluster}"          # the cluster name in stack.yaml
gcp_project: "{project}"
vertex_project: "{project}"
vertex_location: "{region}"
model_group: ""                      # empty: the room grants roles/aiplatform.user to each agent directly
models:
  - id: vertex_ai/gemini-2.5-flash
    label: Gemini 2.5 Flash
  - id: vertex_ai/gemini-2.5-pro
    label: Gemini 2.5 Pro
skills_repo: kobo-skills             # created by kobo's bootstrap, in github_org
skills_bucket: "{project}-kobo-skills"        # bucket names are global: yours must be unused
personas_bucket: "{project}-kobo-personas"
api_base_url: http://kobo.kobo.svc.cluster.local
# The tool gateway (liminal in stack.yaml). Agents the room makes are wired to it;
# an agent with no grant on the gateway sees zero tools, so this is safe to set.
# liminal_admin_url and gateway_config_repo stay empty here: grants are then yours
# to write on the gateway (kobo's docs/adding-a-vendor.md).
liminal_url: http://liminal.liminal.svc.cluster.local
workdir: /data/work
db_url: sqlite:////data/kobo.db
ui_dist: /srv/ui
iap_audience: ""                     # empty: no sign-in proxy; reach the room through a port-forward
# The same GitHub App Gojira uses (install.md step 2): its id and the id of its
# installation on your org, both read when the Secret is written; and where the
# Secret kobo-github mounts the key.
github_app_id: "{app_id}"
github_app_installation_id: "{installation_id}"
github_app_private_key_path: /secrets/github/private-key.pem
